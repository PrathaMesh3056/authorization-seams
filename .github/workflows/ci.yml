name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install TraceGrant Task D dependencies
        run: python -m pip install --disable-pip-version-check -r tests/tracegrant_task_d_20261014/requirements.lock
      - name: Verify frozen artifact hashes
        run: python scripts/verify_artifacts.py
      - name: Run repository QA
        run: python -m pytest -q qa
      - name: Run independent TraceGrant Task D tests
        run: python -m pytest -q tests
        working-directory: tests/tracegrant_task_d_20261014
