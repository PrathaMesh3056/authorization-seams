[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seam-conformance-kit"
version = "0.1.3"
description = "Locked-artifact harnesses and manuscript for cross-mechanism authorization seam measurement"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Prathamesh Patil" },
]
keywords = [
  "agent authorization",
  "cross-mechanism authorization",
  "authorization seams",
  "conformance testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pypdf==6.14.2",
]

[tool.pytest.ini_options]
testpaths = ["qa"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests", "paper/build", "dist"]
